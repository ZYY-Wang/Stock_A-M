[project]
name = "a-share-monitor"
version = "0.1.0"
description = "Daily A-share market breadth and streak monitor"
requires-python = ">=3.10"
dependencies = [
  "akshare>=1.18.40",
  "pandas>=2.0",
  "fastapi>=0.115",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
stock-monitor = "stock_monitor.cli:main"
stock-dashboard = "stock_monitor.web:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
